<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard PST</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <header>
        <h1>Dashboard PST</h1>

        <p>
            Pelayanan Statistik Terpadu
            BPS Kabupaten Banggai Kepulauan
        </p>
    </header>


    <main>
        <section class="filter">

            <label for="period">
                Periode:
            </label>

            <select id="period">

                <option value="all">
                    Semua
                </option>

                <option value="today">
                    Hari Ini
                </option>

                <option value="week">
                    Minggu Ini
                </option>

                <option value="month">
                    Bulan Ini
                </option>

            </select>

        </section>

        <div class="dashboard-info">
            Terakhir diperbarui:
            <span id="last-updated">-</span>
        </div>

        <section class="statistics">

            <div class="card">
                <h3>Total Pengguna</h3>
                <p id="total-users">0</p>
            </div>

            <div class="card">
                <h3>Total Layanan</h3>
                <p id="total-services">0</p>
            </div>

        </section>


        <section class="services">

            <h2>Rekap Layanan</h2>

            <div id="service-list">

                <p>
                    Memuat data...
                </p>

            </div>

        </section>

        <section class="chart-section">

            <h2>Grafik Penggunaan Layanan</h2>

            <div class="chart-container">
                <canvas id="service-chart"></canvas>
            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>

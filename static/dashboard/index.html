<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <title>Dashboard PST</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <aside id="sidebar">

        <h2>Konsultasi</h2>

        <div id="consultation-list"></div>

    </aside>

    <main>

        <div id="header">

            <h2 id="customer-name">
                Belum memilih konsultasi
            </h2>

            <p id="customer-instansi"></p>

        </div>

        <div id="chat-box"></div>

        <div id="bottom">

            <textarea
                id="reply"
                placeholder="Balas..."
            ></textarea>

            <button id="send-btn">

                Kirim

            </button>

            <button id="finish-btn">

                Selesai

            </button>

        </div>

    </main>

</div>

<script src="script.js"></script>

</body>

</html>
